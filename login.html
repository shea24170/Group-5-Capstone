<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retail Shop - Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#2563eb,#1e3a8a);
}

.container{
    width:900px;
    max-width:95%;
    display:flex;
    background:white;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,0.25);
}

/* Left Side */

.left{
    flex:1;
    background:linear-gradient(
        rgba(37,99,235,0.9),
        rgba(30,58,138,0.9)
    );
    color:white;
    padding:50px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.left h1{
    font-size:42px;
    margin-bottom:20px;
}

.left p{
    line-height:1.8;
    font-size:18px;
}

/* Right Side */

.right{
    flex:1;
    padding:50px;
}

.right h2{
    text-align:center;
    margin-bottom:30px;
    color:#1e293b;
}

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#374151;
}

.input-group input{
    width:100%;
    padding:14px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font-size:15px;
}

.input-group input:focus{
    outline:none;
    border-color:#2563eb;
}

/* Password Row */

.password-row{
    position:relative;
}

.password-row button{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:none;
    background:none;
    cursor:pointer;
    color:#2563eb;
}

/* Remember Me */

.options{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
    font-size:14px;
}

.options a{
    color:#2563eb;
    text-decoration:none;
}

/* Button */

.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

.login-btn:hover{
    background:#1d4ed8;
}

/* Register */

.register{
    margin-top:25px;
    text-align:center;
}

.register a{
    color:#2563eb;
    text-decoration:none;
    font-weight:bold;
}

/* Mobile */

@media(max-width:768px){

.container{
    flex-direction:column;
}

.left{
    text-align:center;
}

}

</style>
</head>

<body>

<div class="container">

<div class="left">
    <h1>Retail Shop</h1>
    <p>
        Welcome back! Login to access your account,
        track orders, manage your cart and enjoy
        exclusive shopping offers.
    </p>
</div>

<div class="right">

    <h2>Login to Your Account</h2>

    <form>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email"
                   placeholder="Enter your email"
                   required>
        </div>

        <div class="input-group">
            <label>Password</label>

            <div class="password-row">
                <input type="password"
                       id="password"
                       placeholder="Enter your password"
                       required>

                <button type="button"
                        onclick="togglePassword()">
                    Show
                </button>
            </div>
        </div>

        <div class="options">
            <label>
                <input type="checkbox">
                Remember Me
            </label>

            <a href="#">Forgot Password?</a>
        </div>

        <button class="login-btn" type="submit">
            Login
        </button>

    </form>

    <div class="register">
        Don't have an account?
        <a href="register.html">Register</a>
    </div>

</div>

</div>

<script>

function togglePassword(){

const password =
document.getElementById("password");

if(password.type==="password"){
    password.type="text";
}
else{
    password.type="password";
}

}

</script>

</body>
</html>
